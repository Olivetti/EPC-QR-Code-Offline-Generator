# Keeps one issue open while main carries app changes that no release covers.
#
# GitHub Pages serves main, so the live demo can run ahead of the newest ZIP on
# the releases page without anyone noticing. This job notices. It deliberately
# does not fail the run: main is pushed to directly, and a permanently red
# branch would be ignored within a week.
#
# Only index.html and assets/ count. A README or workflow change does not make
# the published download stale.
name: Release drift

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare against the latest version tag
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Unreleased changes on main
        run: |
          set -euo pipefail

          tag="$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)"
          if [ -z "$tag" ]; then
            echo "No version tag yet — nothing to compare against."
            exit 0
          fi

          changed="$(git diff --name-only "$tag..HEAD" -- index.html assets)"

          open_issue="$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title \
            --jq '[.[] | select(.title == env.TITLE)] | .[0].number // empty')"

          if [ -z "$changed" ]; then
            echo "main matches $tag for the app itself."
            if [ -n "$open_issue" ]; then
              gh issue close "$open_issue" --comment "Covered by $tag."
            fi
            exit 0
          fi

          echo "App files changed since $tag:"
          echo "$changed"

          {
            echo "The app has changed since **$tag**, so the ZIP on the releases"
            echo "page is older than the live demo. Anyone downloading it now gets"
            echo "the previous state."
            echo
            echo "Files changed:"
            echo
            echo '```'
            echo "$changed" | head -n 20
            echo '```'
            echo
            echo "Commits:"
            echo
            echo '```'
            git log --no-merges --pretty='%h %s' "$tag..HEAD" -- index.html assets | head -n 20
            echo '```'
            echo
            echo "To publish: set \`APP_VERSION\` in \`assets/app.js\`, add the"
            echo "matching \`## [<version>]\` section to \`CHANGELOG.md\`, then push"
            echo "a tag — \`git tag -a vYYYY.MM.DD.N -m \"Release vYYYY.MM.DD.N\"\`."
            echo
            echo "Opened and closed automatically by the Release drift workflow."
          } > body.md

          if [ -n "$open_issue" ]; then
            gh issue edit "$open_issue" --body-file body.md
            echo "Updated issue #$open_issue."
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
